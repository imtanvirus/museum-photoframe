<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E30613">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ফটো ফ্রেম</title>
<style>
  :root{
    --red:#E30613;
    --ink:#1a1a1a;
    --paper:#fafafa;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    font-family:'Noto Sans Bengali','Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px max(16px, env(safe-area-inset-right)) max(60px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  h1{
    font-size:clamp(19px, 4.5vw, 22px);
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:0.2px;
    text-align:center;
  }
  p.sub{
    margin:0 0 24px;
    color:#666;
    font-size:clamp(12.5px, 3.4vw, 14px);
    text-align:center;
    max-width:340px;
  }
  .category-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
    background:#eee;
    padding:4px;
    border-radius:10px;
  }
  .category-tabs button{
    border:none;
    background:transparent;
    padding:9px 20px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    color:#777;
    transition:background .15s, color .15s;
    font-family:inherit;
  }
  .category-tabs button.active{
    background:var(--ink);
    color:#fff;
  }
  .frames-wrap{
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    justify-content:center;
    width:100%;
    max-width:1100px;
  }
  .frame-card{
    width:min(92vw, 480px);
    max-width:100%;
  }
  .frame-picker{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:26px;
    justify-content:center;
    max-width:420px;
  }
  .frame-pick-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:8px;
    border-radius:10px;
    border:2px solid transparent;
    background:#fff;
    cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.10);
    font-family:inherit;
  }
  .frame-pick-btn.active{
    border-color:var(--red);
  }
  .frame-pick-btn img{
    width:60px;
    height:60px;
    object-fit:contain;
    background:repeating-linear-gradient(45deg,#f2f2f2,#f2f2f2 6px,#e9e9e9 6px,#e9e9e9 12px);
    border-radius:6px;
  }
  .frame-pick-btn span{
    font-size:11.5px;
    color:#777;
    font-weight:600;
    white-space:nowrap;
  }
  .frame-pick-btn.active span{ color:var(--red); }
  .frame-outer{
    position:relative;
    width:100%;
    background:#fff;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 4px 24px rgba(0,0,0,.10);
    touch-action:none;
    cursor:grab;
  }
  .frame-outer.dragging{cursor:grabbing;}
  .photo-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .photo-layer img{
    position:absolute;
    left:0;
    top:0;
    transform-origin:0 0;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .empty-state{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    color:#bbb;
    font-size:13.5px;
    text-align:center;
    padding:0 12px;
    background:repeating-linear-gradient(45deg,#fff,#fff 10px,#f6f6f6 10px,#f6f6f6 20px);
  }
  .empty-state svg{width:34px;height:34px;stroke:#ccc;flex-shrink:0;}
  .frame-overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
  }
  .frame-overlay img{
    width:100%;
    height:100%;
    display:block;
  }
  .controls{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
  }
  .upload-btn{
    flex:1 1 140px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 14px;
    background:var(--ink);
    color:#fff;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:none;
    font-family:inherit;
    white-space:nowrap;
  }
  .upload-btn:active{opacity:.85;}
  .zoom-btn{
    width:40px;
    height:40px;
    flex:0 0 auto;
    border-radius:8px;
    border:1px solid #ddd;
    background:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
  }
  .zoom-btn:active{background:#f0f0f0;}
  .reset-btn{
    width:40px;
    height:40px;
    flex:0 0 auto;
    border-radius:8px;
    border:1px solid #ddd;
    background:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
  }
  .reset-btn:active{background:#f0f0f0;}
  .hint{
    margin-top:8px;
    font-size:12px;
    color:#999;
    text-align:center;
  }
  input[type=file]{display:none;}
  .download-btn{
    margin-top:36px;
    padding:14px 30px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:9px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(227,6,19,.28);
    width:min(92vw, 320px);
    font-family:inherit;
  }
  .download-btn:active{opacity:.9;}
  .download-btn:disabled{
    background:#ccc;
    box-shadow:none;
    cursor:not-allowed;
  }

  @media (max-width: 420px){
    body{ padding:24px 12px 48px; }
    .category-tabs button{ padding:8px 14px; font-size:13px; }
    .frame-picker{ gap:10px; }
    .frame-pick-btn img{ width:52px; height:52px; }
    .upload-btn{ font-size:13px; padding:10px 12px; }
  }

  @media (min-width: 900px){
    .frames-wrap{ gap:36px; }
  }
</style>
</head>
<body>

eoB9IrjPePjg9bXWQ0mPtzbNj7eC/Mnq8ery1ub7xN2k49UXW1vrt7cC+1cP/t3HW2dkvHsFAAAAAPvtc63rG6e+4XVYXtxaCN5bx06d8gYHAAAAAAA8X9M3xQEAAAAAYC8J7gAAAAAAMEBwBwAAAACAAYI7AAAAAAAMENwBAAAAAGCA4A4AAAAAAAMEdwAAAAAAGCC4AwAAAADAAMEdAAAAAAAGCO4AAAAAADBAcAcAAAAAgAGCOwAAAAAADBDcAQAAAABggOAOAAAAAAADBHcAAAAAABgguAMAAAAAwADBHQAAAAAABgjuAAAAAAAwQHAHAAAAAIABgjsAAAAAAAwQ3AEAAAAAYIDgDgAAAAAAAwR3AAAAAAAYILgDAAAAAMAAwR0AAAAAAAYI7gAAAAAAMEBwBwAAAACAAYI7AAAAAAAMENwBAAAAAGCA4A4AAAAAAAMEdwAAAAAAGCC4AwAAAADAAMEdAAAAAAAGCO4AAAAAADBAcAcAAAAAgAGCOwAAAAAADBDcAQAAAABggOAOAAAAAAADBHcAAAAAABgguAMAAAAAwADBHQAAAAAABgjuAAAAAAAwQHAHAAAAAIABgjsAAAAAAAwQ3AEAAAAAYIDgDgAAAAAAAwR3AAAAAAAYILgDAAAAAMAAwR0AAAAAAAYI7gAAAAAAMEBwBwAAAACAAYI7AAAAAAAM+P/CSMV/YplNhgAAAABJRU5ErkJggg==", w:1500, h:1500 },
    ];
    let currentFrame = 0;

    const framesWrap = document.getElementById('framesWrap');
    const downloadBtn = document.getElementById('downloadBtn');
    const framePicker = document.getElementById('framePicker');
    const categoryTabs = document.getElementById('categoryTabs');

    let cards = [];

    framePicker.querySelectorAll('.frame-pick-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        framePicker.querySelectorAll('.frame-pick-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        currentFrame = parseInt(btn.dataset.frame, 10);
        applyFrameToCards();
      });
    });

    categoryTabs.querySelectorAll('button').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        categoryTabs.querySelectorAll('button').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const cat = tab.dataset.category;
        showCategory(cat);
      });
    });

    function showCategory(cat){
      const pickBtns = Array.from(framePicker.querySelectorAll('.frame-pick-btn'));
      const inCat = pickBtns.filter(b=>b.dataset.category === cat);
      pickBtns.forEach(b=>{ b.style.display = (b.dataset.category === cat) ? 'flex' : 'none'; });
      // only show the picker row itself when there's more than one design to choose from
      framePicker.style.display = inCat.length > 1 ? 'flex' : 'none';
      pickBtns.forEach(b=>b.classList.remove('active'));
      if(inCat.length){
        inCat[0].classList.add('active');
        currentFrame = parseInt(inCat[0].dataset.frame, 10);
        applyFrameToCards();
      }
    }

    function applyFrameToCards(){
      const f = FRAMES[currentFrame];
      cards.forEach(state=>{
        state.frameImgEl.src = f.src;
        state.outer.style.aspectRatio = `${f.w}/${f.h}`;
        if(state.img) fitImage(state);
      });
    }

    function makeCard(id){
      const card = document.createElement('div');
      card.className = 'frame-card';
      card.innerHTML = `
        <div class="frame-outer" id="outer-${id}">
          <div class="photo-layer" id="photoLayer-${id}"></div>
          <div class="empty-state" id="empty-${id}">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="M21 15l-5-5-4 4-3-3-6 6"/></svg>
            <span>ছবি বসাতে ট্যাপ করুন</span>
          </div>
          <div class="frame-overlay"><img src="${FRAMES[currentFrame].src}" id="frameImg-${id}" alt="frame"></div>
        </div>
        <div class="controls">
          <button class="upload-btn" id="uploadBtn-${id}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            ছবি বাছাই করুন
          </button>
          <button class="zoom-btn" id="zoomOut-${id}">−</button>
          <button class="zoom-btn" id="zoomIn-${id}">+</button>
          <button class="reset-btn" id="reset-${id}" title="রিসেট">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          </button>
          <input type="file" accept="image/*" id="fileInput-${id}">
        </div>
        <div class="hint">টেনে ছবি সরান, স্ক্রল/পিঞ্চ করে জুম করুন</div>
      `;
      framesWrap.appendChild(card);

      const state = {
        id, img:null, scale:1, minScale:1, x:0, y:0,
        outer: document.getElementById(`outer-${id}`),
        layer: document.getElementById(`photoLayer-${id}`),
        empty: document.getElementById(`empty-${id}`),
        fileInput: document.getElementById(`fileInput-${id}`),
        frameImgEl: document.getElementById(`frameImg-${id}`),
      };
      state.outer.style.aspectRatio = `${FRAMES[currentFrame].w}/${FRAMES[currentFrame].h}`;

      document.getElementById(`uploadBtn-${id}`).addEventListener('click', ()=>state.fileInput.click());
      state.fileInput.addEventListener('change', (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev)=> loadImage(state, ev.target.result);
        reader.readAsDataURL(file);
      });

      document.getElementById(`zoomIn-${id}`).addEventListener('click', ()=> zoom(state, 1.15));
      document.getElementById(`zoomOut-${id}`).addEventListener('click', ()=> zoom(state, 1/1.15));
      document.getElementById(`reset-${id}`).addEventListener('click', ()=> fitImage(state));

      // drag
      let dragging=false, startX=0, startY=0, origX=0, origY=0;
      const down = (clientX, clientY)=>{
        if(!state.img) return;
        dragging=true;
        state.outer.classList.add('dragging');
        startX=clientX; startY=clientY; origX=state.x; origY=state.y;
      };
      const move = (clientX, clientY)=>{
        if(!dragging) return;
        state.x = origX + (clientX-startX);
        state.y = origY + (clientY-startY);
        clampAndRender(state);
      };
      const up = ()=>{ dragging=false; state.outer.classList.remove('dragging'); };

      state.outer.addEventListener('mousedown', e=>down(e.clientX,e.clientY));
      window.addEventListener('mousemove', e=>move(e.clientX,e.clientY));
      window.addEventListener('mouseup', up);

      state.outer.addEventListener('touchstart', e=>{
        if(e.touches.length===1) down(e.touches[0].clientX, e.touches[0].clientY);
      }, {passive:true});
      state.outer.addEventListener('touchmove', e=>{
        if(e.touches.length===1 && dragging){ move(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
      }, {passive:false});
      state.outer.addEventListener('touchend', up);

      // pinch zoom
      let pinchStartDist=0, pinchStartScale=1;
      state.outer.addEventListener('touchstart', e=>{
        if(e.touches.length===2){
          pinchStartDist = dist(e.touches[0], e.touches[1]);
          pinchStartScale = state.scale;
        }
      }, {passive:true});
      state.outer.addEventListener('touchmove', e=>{
        if(e.touches.length===2 && state.img){
          const d = dist(e.touches[0], e.touches[1]);
          const factor = d / pinchStartDist;
          setScale(state, pinchStartScale * factor);
          e.preventDefault();
        }
      }, {passive:false});

      state.outer.addEventListener('wheel', e=>{
        if(!state.img) return;
        e.preventDefault();
        zoom(state, e.deltaY < 0 ? 1.08 : 1/1.08);
      }, {passive:false});

      cards.push(state);
      return state;
    }

    function dist(t1,t2){
      return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    }

    function loadImage(state, src){
      const img = new Image();
      img.onload = ()=>{
        state.img = img;
        state.empty.style.display='none';
        state.layer.innerHTML='';
        const el = document.createElement('img');
        el.src = src;
        state.layer.appendChild(el);
        state.imgEl = el;
        fitImage(state);
        checkDownloadReady();
      };
      img.src = src;
    }

    function fitImage(state){
      if(!state.img) return;
      const rect = state.outer.getBoundingClientRect();
      const cw = rect.width, ch = rect.height;
      const iw = state.img.naturalWidth, ih = state.img.naturalHeight;
      const scaleToCover = Math.max(cw/iw, ch/ih);
      state.minScale = scaleToCover;
      state.scale = scaleToCover;
      state.x = (cw - iw*state.scale)/2;
      state.y = (ch - ih*state.scale)/2;
      render(state);
    }

    function zoom(state, factor){
      if(!state.img) return;
      setScale(state, state.scale*factor, true);
    }

    function setScale(state, newScale, keepCenter){
      if(!state.img) return;
      const rect = state.outer.getBoundingClientRect();
      newScale = Math.max(state.minScale, Math.min(newScale, state.minScale*6));
      if(keepCenter){
        const cx = rect.width/2, cy = rect.height/2;
        const ratio = newScale/state.scale;
        state.x = cx - (cx - state.x)*ratio;
        state.y = cy - (cy - state.y)*ratio;
      }
      state.scale = newScale;
      clampAndRender(state);
    }

    function clampAndRender(state){
      if(!state.img) return;
      const rect = state.outer.getBoundingClientRect();
      const cw = rect.width, ch = rect.height;
      const iw = state.img.naturalWidth*state.scale, ih = state.img.naturalHeight*state.scale;
      const minX = cw - iw, minY = ch - ih;
      state.x = Math.min(0, Math.max(state.x, minX));
      state.y = Math.min(0, Math.max(state.y, minY));
      render(state);
    }

    function render(state){
      if(!state.imgEl) return;
      state.imgEl.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    function checkDownloadReady(){
      downloadBtn.disabled = !cards.some(c=>c.img);
    }

    function buildLayout(n){
      framesWrap.innerHTML='';
      cards = [];
      for(let i=0;i<n;i++) makeCard(i);
      checkDownloadReady();
    }

    // download: render each frame to canvas at native frame resolution
    downloadBtn.addEventListener('click', async ()=>{
      const frameImg = new Image();
      frameImg.src = FRAMES[currentFrame].src;
      await new Promise(res=> frameImg.complete ? res() : frameImg.onload=res);
      const FW = frameImg.naturalWidth, FH = frameImg.naturalHeight;

      let idx=0;
      for(const state of cards){
        if(!state.img) continue;
        idx++;
        const canvas = document.createElement('canvas');
        canvas.width = FW; canvas.height = FH;
        const ctx = canvas.getContext('2d');

        const rect = state.outer.getBoundingClientRect();
        const scaleFactor = FW / rect.width;

        ctx.drawImage(
          state.img,
          0,0,state.img.naturalWidth, state.img.naturalHeight,
          state.x*scaleFactor, state.y*scaleFactor,
          state.img.naturalWidth*state.scale*scaleFactor,
          state.img.naturalHeight*state.scale*scaleFactor
        );
        ctx.drawImage(frameImg, 0,0, FW, FH);

        const link = document.createElement('a');
        link.download = `photo-frame-${idx}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        await new Promise(r=>setTimeout(r, 300));
      }
    });

    showCategory('landscape');
    buildLayout(1);
  </script>
